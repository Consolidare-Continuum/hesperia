# hesperia.prichindel.com — Hesperia API + Hex Matrix SPA.
# Backend: 127.0.0.1:9005. Auth: Authentik forward-auth (outpost on trustmaster :19000).
#
# /hesperia/ API endpoint is EXEMPT from Authentik — uses Bearer token auth (GPT Actions).
# /openapi.json and /health are also exempt — needed for API discoverability and monitoring.
# Browser SPA (/hex-matrix/) and all other paths require Authentik login.
#
# Install (prichindel):
#   sudo cp cluster/prichindel/nginx-hesperia.prichindel.com.conf /etc/nginx/conf.d/hesperia.prichindel.com.conf
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=hesperia_api:10m    rate=5r/s;
limit_req_zone $binary_remote_addr zone=hesperia_health:10m rate=30r/s;

log_format hesperia '$remote_addr $request_id $msec "$request" $status $request_time $body_bytes_sent $upstream_status $upstream_response_time';

server {
    listen 80;
    server_name hesperia.prichindel.com;
    if ($host != "hesperia.prichindel.com") { return 444; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hesperia.prichindel.com;
    if ($host != "hesperia.prichindel.com") { return 444; }

    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/hesperia.access.log hesperia;

    ssl_certificate     /etc/letsencrypt/live/hesperia.prichindel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hesperia.prichindel.com/privkey.pem;

    client_max_body_size 32k;

    limit_req_status 429;
    proxy_intercept_errors on;
    error_page 502 503 504 = @json_5xx;
    error_page 415 = @json_415;
    error_page 429 = @json_429;
    error_page 401 = @authentik_hesperia_signin;

    location @json_5xx {
        default_type application/json;
        add_header X-Content-Type-Options nosniff;
        return 503 '{"error":true,"message":"Service unavailable","code":503}';
    }
    location @json_415 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff;
        return 415 '{"error":true,"message":"Content-Type must be application/json","code":415}';
    }
    location @json_429 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff;
        return 429 '{"error":true,"message":"Too Many Requests","code":429}';
    }

    # Authentik outpost — must be reachable without auth (handles login callbacks)
    location /outpost.goauthentik.io/ {
        proxy_pass       http://192.168.100.67:19000/outpost.goauthentik.io/;
        proxy_set_header Host             $host;
        proxy_set_header X-Original-URL   $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect http://server:9000            https://trustmaster.prichindel.com;
        proxy_redirect http://authentik-server-1:9000 https://trustmaster.prichindel.com;
    }

    location = /_authentik_auth {
        proxy_intercept_errors off;
        internal;
        proxy_pass       http://192.168.100.67:19000/outpost.goauthentik.io/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        proxy_set_header Host             $host;
        proxy_set_header X-Original-URL   $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Hidden paths — block before auth check
    location ~ ^/(docs|redoc|swagger) { return 404; }

    # /health — exempt (monitoring, public)
    location /health {
        limit_except GET OPTIONS { deny all; }
        if ($request_method = OPTIONS) {
            add_header Allow "GET, OPTIONS";
            add_header X-Request-ID $request_id;
            return 204;
        }
        limit_req zone=hesperia_health burst=10 nodelay;
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # /openapi.json — exempt (needed by GPT Actions and API clients)
    location /openapi.json {
        limit_except GET OPTIONS { deny all; }
        if ($request_method = OPTIONS) {
            add_header Allow "GET, OPTIONS";
            add_header X-Request-ID $request_id;
            return 204;
        }
        limit_req zone=hesperia_health burst=5 nodelay;
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout    10s;
    }

    # /hesperia/ API — exempt from Authentik; uses Bearer token auth (called by GPT Actions)
    location /hesperia/ {
        limit_except POST OPTIONS { deny all; }
        if ($request_method = OPTIONS) {
            add_header Allow "POST, OPTIONS";
            add_header X-Request-ID $request_id;
            return 204;
        }
        set $reject_ct 0;
        if ($request_method = POST) { set $reject_ct 1; }
        if ($http_content_type !~* ^application/json) { set $reject_ct "${reject_ct}1"; }
        if ($reject_ct = "11") { return 415; }
        limit_req zone=hesperia_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Cf-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header Cf-Ray            $http_cf_ray;
        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Browser root redirect — behind auth
    location = / {
        error_page 401 = @authentik_hesperia_signin;
        auth_request     /_authentik_auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie   $auth_cookie;
        return 302 /inspector/session_inspector_min/;
    }

    # Hex Matrix SPA — behind Authentik
    location ^~ /hex-matrix/ {
        error_page 401 = @authentik_hesperia_signin;
        auth_request     /_authentik_auth;
        auth_request_set $auth_cookie        $upstream_http_set_cookie;
        add_header       Set-Cookie          $auth_cookie;
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        proxy_set_header X-authentik-username $authentik_username;

        limit_except GET HEAD OPTIONS { deny all; }
        if ($request_method = OPTIONS) {
            add_header Allow "GET, HEAD, OPTIONS";
            add_header X-Request-ID $request_id;
            return 204;
        }
        root /var/www/hesperia-sites;
        try_files $uri $uri/ /hex-matrix/index.html;
    }


    # Django output_views — sessions index, inspector, static (127.0.0.1:8010)
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location ^~ /sessions/ {
        error_page 401 = @authentik_hesperia_signin;
        auth_request     /_authentik_auth;
        auth_request_set $auth_cookie        $upstream_http_set_cookie;
        add_header       Set-Cookie          $auth_cookie;
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location ^~ /inspector/ {
        error_page 401 = @authentik_hesperia_signin;
        auth_request     /_authentik_auth;
        auth_request_set $auth_cookie        $upstream_http_set_cookie;
        add_header       Set-Cookie          $auth_cookie;
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    location ^~ /preview/ {
        error_page 401 = @authentik_hesperia_signin;
        auth_request     /_authentik_auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie   $auth_cookie;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — 404 (scanners get nothing)
    location / {
        return 404;
    }

    location @authentik_hesperia_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }
}
