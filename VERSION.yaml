system_version: "0.5.5"
release_stage: "modular_tfp_mainline"

components:
  core_engine: "0.5.5"
  dynamics: "0.5.5"
  triz: "0.5.5"
  clinical: "0.5.5-modular"
  calibration: "0.5.5"

schema:
  public_output: "v1"
  internal_graph: "v1"

pipelines:
  e2e: "e2e_v2"
  structural: "structural_v1"
  api: "api_v1"
  triz: "triz_v1"

# Governed interaction matrices (L_F, C_F, R_F) under assets/matrices/production/
# Concept→Hex P_CH under assets/matrices/pch/
matrices:
  production_bundle: "v1"
  pch_bundle: "v1"

# Governed calibration profiles: assets/calibration/profiles_{bundle}.json
calibration:
  profile_bundle: "v1"
  active_profile: "default_v1"

defaults:
  calibration_profile: "default_v1"
  # Pinned dict pack dir under assets/calibration/dicts/<name>/ (TFP-GATE-A0; validate_version_consistency checks existence).
  active_calibration_dict_pack: "v0_6_0_clr_v052_2"

# TFP module v1 compatibility (TFP-V1-12): must match defaults.active_calibration_dict_pack for mainline.
tfp_module_v1:
  seal_requested: false
  pinned_calibration_dict_pack: "v0_6_0_clr_v052_2"

# Filled at runtime by hesperia.system.version (never commit secrets here)
build:
  timestamp: null
  git_commit: null
