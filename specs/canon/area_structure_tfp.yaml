# LEVEL 1 — Структура областей TFP / Кернберг. Язык: русский.
# 10 операционных областей (индексы 0–9). Топология: икосаэдр (12 узлов).
# T1.1 Определение областей | T1.2 Цель области | T1.3 Смежность областей.
version: 1
domain: TFP_KERNBERG
language: ru
public_area_count: 10

areas:
  - area_id: A1
    area_index: 0
    name: Drives & Affects
    name_ru: Влечения и аффекты
    description: |
      Базовая регуляция влечений и аффектов; импульсы, эмоциональная напряжённость, аффективная толерантность.
    clinical_scope: |
      Оценка силы влечений, аффективной лабильности, толерантности к фрустрации; связь с объектными отношениями и защитами.
    activation_signals:
      - влечения
      - аффекты
      - импульс
      - эмоция
      - толерантность к фрустрации
      - либидо
      - агрессия (как влечение)
    exclusions:
      - чисто поведенческое описание без аффекта
      - когнитивное содержание без связи влечение/аффект
    area_neighbors: [1, 5, 7]  # operational only (0–9); full topology 0→1,5,7,10,11

  - area_id: A2
    area_index: 1
    name: Object Relations
    name_ru: Объектные отношения
    description: |
      Внутренние репрезентации себя и объекта; качество объектных связей, интернализованные отношения.
    clinical_scope: |
      Структура объектных отношений (Кернберг), уровень интеграции, расщепление, примитивные vs зрелые связи.
    activation_signals:
      - объектные отношения
      - репрезентация себя
      - интернализованные
      - расщепление
      - парциальный объект
      - целостный объект
    exclusions:
      - чисто межличностное поведение без внутренней репрезентации
    area_neighbors: [0, 5, 7, 8, 9]

  - area_id: A3
    area_index: 2
    name: Defensive Operations
    name_ru: Защитные операции
    description: |
      Защитные механизмы; примитивные и зрелые защиты, их иерархия и гибкость.
    clinical_scope: |
      Идентификация защит (отрицание, проекция, проективная идентификация, изоляция и т.д.); уровень организации защит.
    activation_signals:
      - защита
      - отрицание
      - проекция
      - проективная идентификация
      - вытеснение
      - примитивные защиты
    exclusions:
      - адаптивное совладание без защитного качества
    area_neighbors: [3, 4, 6]

  - area_id: A4
    area_index: 3
    name: Aggression
    name_ru: Агрессия
    description: |
      Агрессия как влечение и как компонент конфликта; деструктивность, ненависть, садизм.
    clinical_scope: |
      Проявления агрессии, связь с нарциссизмом и перверсиями; деструктивные объектные отношения.
    activation_signals:
      - агрессия
      - деструктивность
      - ненависть
      - садизм
      - ярость
      - зависть (агрессивная)
    exclusions:
      - ассертивное поведение без агрессивного намерения
    area_neighbors: [2, 4, 6, 8, 9]

  - area_id: A5
    area_index: 4
    name: Perversions
    name_ru: Перверсии
    description: |
      Перверзная организация; слияние агрессии и либидо, нарушение границ, сексуализация агрессии.
    clinical_scope: |
      Перверзные сценарии, триангуляция, манипуляция; связь с нарциссической и пограничной организацией.
    activation_signals:
      - перверсия
      - перверзный
      - триангуляция
      - сексуализированная агрессия
      - нарушение границ
    exclusions:
      - нормативная сексуальность
      - неперверзный фетиш (клиническое различие)
    area_neighbors: [2, 3, 5, 9]

  - area_id: A6
    area_index: 5
    name: Narcissism
    name_ru: Нарциссизм
    description: |
      Нарциссическая организация; грандиозность, идеализация/обесценивание, нарциссическая ярость.
    clinical_scope: |
      Уровень нарциссизма (нормальный — патологический); связь с пограничной организацией и идентичностью.
    activation_signals:
      - нарциссизм
      - грандиозность
      - идеализация
      - обесценивание
      - нарциссическая ярость
      - регуляция самооценки
    exclusions:
      - здоровая самооценка
    area_neighbors: [0, 1, 4, 9]

  - area_id: A7
    area_index: 6
    name: Love / Relational Capacity
    name_ru: Любовь / реляционная способность
    description: |
      Способность к любви и стабильным объектным связям; интеграция хорошего и плохого объекта.
    clinical_scope: |
      Зрелая любовь, способность к зависимости и близости; контраст с примитивными связями.
    activation_signals:
      - любовь
      - привязанность
      - близость
      - зависимость
      - зрелые объектные отношения
    exclusions:
      - только поверхностная социальная связь
    area_neighbors: [2, 3, 7, 8]

  - area_id: A8
    area_index: 7
    name: Structural Diagnosis
    name_ru: Структурный диагноз
    description: |
      Уровень организации личности (нейротическая — пограничная — психотическая); структурная оценка.
    clinical_scope: |
      Дифференциация по Кернбергу; тестирование реальности, идентичность, примитивные защиты и супер-эго.
    activation_signals:
      - структурный диагноз
      - организация личности
      - пограничный
      - невротический
      - психотический
      - диффузия идентичности
    exclusions:
      - только синдромальный диагноз (DSM) без структуры
    area_neighbors: [0, 1, 6, 8]

  - area_id: A9
    area_index: 8
    name: Therapeutic Technique
    name_ru: Терапевтическая техника
    description: |
      Технические аспекты TFP; интерпретация переноса, нейтральность, анализ контрпереноса.
    clinical_scope: |
      Применение техники TFP в сессии: интерпретации, управление рамкой, работа с переносом/контрпереносом.
    activation_signals:
      - техника
      - интерпретация переноса
      - контрперенос
      - нейтральность
      - технический нейтралитет
      - здесь-и-сейчас
    exclusions:
      - общая психотерапия без рамки TFP
    area_neighbors: [1, 3, 6, 7, 9]

  - area_id: A10
    area_index: 9
    name: Treatment Process
    name_ru: Процесс лечения
    description: |
      Процесс терапии и изменения; фазы лечения, контракт, цели, регрессии и прогресс.
    clinical_scope: |
      Организация лечения (контракт, фазы TFP), процессуальные аспекты, регрессии, интеграция.
    activation_signals:
      - процесс лечения
      - терапевтический контракт
      - фазы лечения
      - регрессия
      - интеграция
    exclusions:
      - фокус на одной сессии без процесса
    area_neighbors: [1, 3, 4, 5, 8]

# T1.3 — Area distance (shortest path, operational subgraph 0–9). Diameter = 3.
# Computed from icosahedral adjacency restricted to nodes 0–9. Used for propagation and metrics.
area_distance_matrix:
  #     A1  A2  A3  A4  A5  A6  A7  A8  A9  A10
  - [ 0,  1,  3,  3,  2,  1,  2,  1,  2,  2 ]  # A1
  - [ 1,  0,  3,  2,  2,  1,  2,  1,  1,  1 ]  # A2
  - [ 3,  3,  0,  1,  1,  2,  1,  2,  2,  2 ]  # A3
  - [ 3,  2,  1,  0,  1,  2,  1,  2,  1,  1 ]  # A4
  - [ 2,  2,  1,  1,  0,  1,  2,  3,  2,  1 ]  # A5
  - [ 1,  1,  2,  2,  1,  0,  3,  2,  2,  1 ]  # A6
  - [ 2,  2,  1,  1,  2,  3,  0,  1,  1,  2 ]  # A7
  - [ 1,  1,  2,  2,  3,  2,  1,  0,  1,  2 ]  # A8
  - [ 2,  1,  2,  1,  2,  2,  1,  1,  0,  1 ]  # A9
  - [ 2,  1,  2,  1,  1,  1,  2,  2,  1,  0 ]  # A10
