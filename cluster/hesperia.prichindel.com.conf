# Hesperia API — nginx (GPT Actions). Deploy: sudo cp to /etc/nginx/conf.d/
# Reload: sudo nginx -t && sudo systemctl reload nginx
#
# Method allowlist: limit_except (deny all other methods → 403). OPTIONS: return 204 at nginx (Allow + X-Request-ID only; no CORS).
# Auth: only /hesperia/analyze requires Bearer (app); no auth_request here. Log: no Authorization; include upstream status/time.
# Host: strict server_name; wrong Host → 444 (connection close, no response). Prevents host-header abuse / cache poisoning.
limit_req_zone $binary_remote_addr zone=hesperia_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=hesperia_health:10m rate=30r/s;

log_format hesperia '$remote_addr $request_id $msec "$request" $status $request_time $body_bytes_sent $upstream_status $upstream_response_time';

server {
    listen 80;
    server_name hesperia.prichindel.com;
    if ($host != "hesperia.prichindel.com") { return 444; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hesperia.prichindel.com;
    if ($host != "hesperia.prichindel.com") { return 444; }
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/hesperia.access.log hesperia;

    ssl_certificate     /etc/letsencrypt/live/hesperia.prichindel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hesperia.prichindel.com/privkey.pem;

    client_max_body_size 32k;

    limit_req_status 429;
    proxy_intercept_errors on;
    error_page 502 503 504 = @json_5xx;
    error_page 415 = @json_415;
    error_page 429 = @json_429;

    # JSON-only error responses (no HTML fallback). default_type ensures no sniffing.
    location @json_5xx {
        default_type application/json;
        add_header X-Content-Type-Options nosniff;
        return 503 '{"error":true,"message":"Service unavailable","code":503}';
    }

    location @json_415 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff;
        return 415 '{"error":true,"message":"Content-Type must be application/json","code":415}';
    }

    location @json_429 {
        default_type application/json;
        add_header X-Content-Type-Options nosniff;
        return 429 '{"error":true,"message":"Too Many Requests","code":429}';
    }

    location ~ ^/(docs|redoc|swagger) {
        return 404;
    }

    location /health {
        limit_except GET OPTIONS {
            deny all;
        }
        if ($request_method = OPTIONS) {
            add_header Allow "GET, OPTIONS";
            add_header X-Request-ID $request_id;
            return 204;
        }
        limit_req zone=hesperia_health burst=10 nodelay;
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /openapi.json {
        limit_except GET OPTIONS {
            deny all;
        }
        if ($request_method = OPTIONS) {
            add_header Allow "GET, OPTIONS";
            add_header X-Request-ID $request_id;
            return 204;
        }
        limit_req zone=hesperia_health burst=5 nodelay;
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    location /hesperia/ {
        limit_except POST OPTIONS {
            deny all;
        }
        if ($request_method = OPTIONS) {
            add_header Allow "POST, OPTIONS";
            add_header X-Request-ID $request_id;
            return 204;
        }
        # Prefix match so application/json; charset=utf-8 is accepted
        set $reject_ct 0;
        if ($request_method = POST) { set $reject_ct 1; }
        if ($http_content_type !~* ^application/json) { set $reject_ct "${reject_ct}1"; }
        if ($reject_ct = "11") { return 415; }
        limit_req zone=hesperia_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Cf-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cf-Ray $http_cf_ray;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Everything else: 404 (/, /favicon.ico, /robots.txt, /.env, /.git — scanners get no default page or leakage)
    location / {
        return 404;
    }
}
