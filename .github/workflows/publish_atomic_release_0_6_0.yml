name: Publish Atomic Release 0.6.0

on:
  push:
    tags:
      - "0.6.0"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.6.0
          name: HESPERIA v0.6.0 Sealed Engine Baseline with External Data Contract
          body: |
            HESPERIA v0.6.0 sealed engine baseline.

            Included in this release line:
            - sealed baseline release contract
            - checked Docker bundle workflow
            - release docs for dicts, corpus, Chroma, outputs, Docker
            - agentic install contract

            Key release paths:
            - `release/v0.6.0/RELEASE_CONTENTS.md`
            - `release/v0.6.0/AGENTIC_INSTALL.md`
            - `release/v0.6.0/DOCKER_BUNDLE.md`
            - `release/v0.6.0/final_gate_status.json`
          draft: false
          prerelease: false
